[package]
name = "rowx-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rowx-postgres = { path = "../crates/rowx-postgres" }
# the plan walkers take a `serde_json::Value`, and rowx-postgres already depends on it
serde_json = "1"

# the workspace forbids unsafe code, and `fuzz_target!` expands to some, so this crate sits outside it
[workspace]

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[bin]]
name = "array"
path = "fuzz_targets/array.rs"
test = false
doc = false
bench = false

