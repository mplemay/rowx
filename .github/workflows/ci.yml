name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `uv run` must not sync, which would rebuild the extension; each job builds it once with `maturin develop`.
env:
  UV_NO_SYNC: "1"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    # keep the 3.14 cell named "Linux" so an existing required check stays valid
    name: ${{ matrix.python-version == '3.14' && 'Linux' || format('Linux ({0})', matrix.python-version) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rowx
          POSTGRES_PASSWORD: rowx
          POSTGRES_DB: rowx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowx -d rowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ROWX_REQUIRE_DB: "1"
      ROWX_TEST_DSN: postgresql://rowx:rowx@localhost:5432/rowx
      # overrides .python-version; setup-uv also exports this from python-version
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PYO3_PYTHON is .venv/bin/python, so each interpreter needs its own artifacts
          key: py${{ matrix.python-version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        run: uv tool install rust-just

      - name: Install the dependencies
        run: uv sync --all-groups --locked --no-install-project

      - name: Build the extension
        run: uv run maturin develop

      - name: Check
        if: matrix.python-version == '3.14'
        run: just check

      - name: Test rust
        if: matrix.python-version == '3.14'
        run: just test-rust

      # a service container can't mount certs or override the entrypoint, so the TLS postgres comes from scripts/pg.sh
      - name: Start the TLS postgres
        run: echo "ROWX_TEST_DSN_SSL=$(scripts/pg.sh up --ssl)" >> "$GITHUB_ENV"

      - name: Test python
        run: just test-py

  macos:
    name: macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        run: uv tool install rust-just

      - name: Install the dependencies
        run: uv sync --all-groups --no-install-project

      - name: Build the extension
        run: uv run maturin develop

      - name: Check
        run: just check

  examples:
    name: Examples
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rowx
          POSTGRES_PASSWORD: rowx
          POSTGRES_DB: rowx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowx -d rowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-install-project

      - name: Build the extension
        run: uv run maturin develop

      - name: Apply the example schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/app/schema.sql

      - name: Run the example
        run: uv run python examples/app/main.py

      - name: Check the example
        run: uv run rowx check examples/app
