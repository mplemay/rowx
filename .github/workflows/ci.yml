name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `uv run` must not sync, which would rebuild the extension; each job builds it once with `maturin develop`.
env:
  UV_NO_SYNC: "1"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rowx
          POSTGRES_PASSWORD: rowx
          POSTGRES_DB: rowx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowx -d rowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ROWX_REQUIRE_DB: "1"
      ROWX_TEST_DSN: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        run: uv tool install rust-just

      - name: Install the dependencies
        run: uv sync --all-groups --no-install-project

      - name: Build the extension
        run: uv run maturin develop

      - name: Check
        run: just check

      - name: Test rust
        run: just test-rust

      # a service container can't mount certs or override the entrypoint, so the TLS postgres comes from scripts/pg.sh
      - name: Start the TLS postgres
        run: echo "ROWX_TEST_DSN_SSL=$(scripts/pg.sh up --ssl)" >> "$GITHUB_ENV"

      - name: Test python
        run: just test-py

  macos:
    name: macOS
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        run: uv tool install rust-just

      - name: Install the dependencies
        run: uv sync --all-groups --no-install-project

      - name: Build the extension
        run: uv run maturin develop

      - name: Check
        run: just check

  examples:
    name: Examples
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rowx
          POSTGRES_PASSWORD: rowx
          POSTGRES_DB: rowx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowx -d rowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-groups --no-install-project

      - name: Build the extension
        run: uv run maturin develop

      - name: Apply the example schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/app/schema.sql

      - name: Run the example
        run: uv run python examples/app/main.py

      - name: Check the example
        run: uv run rowx check examples/app

      # the migrations example gets a database of its own, because its tables clash with the app example's
      - name: Create the migrations example database
        working-directory: examples/migrations
        env:
          DATABASE_URL: postgresql://rowx:rowx@localhost:5432/migrations_example
        run: uv run --project ../.. rowx database create

      - name: Run the migrations example
        working-directory: examples/migrations
        env:
          DATABASE_URL: postgresql://rowx:rowx@localhost:5432/migrations_example
        run: uv run --project ../.. python bookshelf.py

      - name: Check the migrations example against the migrated database
        working-directory: examples/migrations
        env:
          DATABASE_URL: postgresql://rowx:rowx@localhost:5432/migrations_example
        run: uv run --project ../.. rowx check

      - name: Check the migrations example with a scratch database
        working-directory: examples/migrations
        run: uv run --project ../.. rowx check --scratch

      - name: Test the migrations example
        working-directory: examples/migrations
        run: uv run --project ../.. pytest -p no:cacheprovider
