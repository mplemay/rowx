name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `uv run` must not sync, which would rebuild the extension; each job builds it once with `maturin develop`.
env:
  UV_NO_SYNC: "1"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: test (${{ matrix.platform }}/rust/${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: [core, postgres, sqlite]
        platform: [Linux, macOS, Windows]
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-15 }
          - { platform: Windows, runner: windows-latest }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          key: ${{ github.job }}-${{ matrix.package }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start PostgreSQL for the Rust driver
        if: runner.os == 'Linux' && matrix.package == 'postgres'
        run: bash scripts/ci-start-postgres.sh

      - name: Start TLS PostgreSQL
        if: runner.os == 'Linux' && matrix.package == 'postgres'
        run: bash scripts/ci-start-tls.sh

      - name: Test Rust package
        shell: bash
        env:
          CI_PACKAGE: ${{ matrix.package }}
        run: bash scripts/ci-test-rust.sh

  python:
    name: test (${{ matrix.platform }}/${{ matrix.python-version }}/${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: [core, postgres, sqlite, cli]
        python-version: ["3.14", "3.15"]
        platform: [Linux, macOS, Windows]
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-15 }
          - { platform: Windows, runner: windows-latest }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Rust for native extensions
        if: matrix.package != 'core'
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache Rust build artifacts
        if: matrix.package != 'core'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-python-${{ matrix.package }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test portable Python package
        shell: bash
        env:
          CI_PACKAGE: ${{ matrix.package }}
        run: bash scripts/ci-test-python.sh

  python-postgres:
    name: test (Linux/${{ matrix.python-version }}/postgres/${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
        shard: [db, plugin]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rowx
          POSTGRES_PASSWORD: rowx
          POSTGRES_DB: rowx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowx -d rowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ROWX_REQUIRE_DB: "1"
      ROWX_TEST_DSN: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start TLS PostgreSQL
        if: matrix.shard == 'db'
        run: bash scripts/ci-start-tls.sh

      - name: Test PostgreSQL integration
        env:
          CI_PACKAGE: postgres
          CI_POSTGRES_SHARD: ${{ matrix.shard }}
        run: bash scripts/ci-test-python.sh

  embedded-wheel:
    name: wheel (Linux/3.14/embedded)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache the Wasmer build
        id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record the cached Wasmer artifacts
        run: bash scripts/ci-embedded-cache.sh record

      # the manylinux2014 container (glibc 2.17) gives the wheel a manylinux_2_17 tag; it reads the pinned toolchain from
      # rust-toolchain.toml and mounts the checkout, so the cached target directory is reused
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          manylinux: "2014"
          args: -m packages/rowx-embedded/Cargo.toml --release --locked --out dist-embedded --interpreter python3.14

      - name: Check that a warm cache did not rebuild Wasmer
        if: steps.cache.outputs.cache-hit == 'true'
        run: bash scripts/ci-embedded-cache.sh verify

      - name: Check the wheel (tag, size budget, contents, licenses)
        run: uv run --no-project --python 3.14 python scripts/validate-embedded-wheels.py dist-embedded --platform _x86_64

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-embedded-wheel-Linux
          path: dist-embedded/*.whl
          if-no-files-found: error
          retention-days: 7

  embedded-wheel-macos:
    name: wheel (macOS/3.14/embedded)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64-apple-darwin
          args: -m packages/rowx-embedded/Cargo.toml --release --locked --out dist-embedded --interpreter python3.14

      - name: Check the wheel (tag, size budget, contents, licenses)
        run: python scripts/validate-embedded-wheels.py dist-embedded --platform macosx_

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-embedded-wheel-macOS
          path: dist-embedded/*.whl
          if-no-files-found: error
          retention-days: 7

  embedded-rust:
    name: test (${{ matrix.platform }}/rust/embedded)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, macOS]
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache the Wasmer build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test and lint the engine host
        env:
          CI_PACKAGE: embedded
        run: bash scripts/ci-test-rust.sh

      - name: Check the embedded source archive
        if: runner.os == 'Linux'
        run: uv run --no-project --python 3.14 python scripts/validate-embedded-sdist.py

      # the allowed licenses are in deny.toml; the tool is installed from crates.io at a fixed version
      # (the Cargo cache keeps the binary)
      - name: Check the licenses of the engine tree
        if: runner.os == 'Linux'
        run: bash scripts/ci-embedded-licenses.sh

  python-embedded:
    name: test (${{ matrix.platform }}/${{ matrix.python-version }}/embedded)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
        platform: [Linux, macOS]
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-15 }
    needs: [embedded-wheel, embedded-wheel-macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the embedded wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-embedded-wheel-${{ runner.os }}
          path: dist-embedded

      - name: Test the embedded wheel and engine
        env:
          CI_PACKAGE: embedded
        run: bash scripts/ci-test-python.sh

  lint:
    name: lint (${{ matrix.platform }}/3.14/workspace)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, macOS]
        include:
          - { platform: Linux, runner: ubuntu-latest }
          - { platform: macOS, runner: macos-15 }
    needs: [embedded-wheel, embedded-wheel-macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download the embedded wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-embedded-wheel-${{ runner.os }}
          path: dist-embedded

      - name: Install just
        run: uv tool install rust-just

      - name: Install the workspace and run checks
        run: bash scripts/ci-lint.sh

  distributions:
    name: check (Linux/3.14/distributions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Validate workspace versions and wheel interfaces
        run: bash scripts/ci-distributions.sh

  examples:
    name: test (Linux/3.14/examples)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rowx
          POSTGRES_PASSWORD: rowx
          POSTGRES_DB: rowx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowx -d rowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: bash scripts/ci-rust-toolchain.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # one workspace: `uv sync` builds the engine (and Wasmer) into the same target directory
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --frozen --no-install-package rowx-postgres --no-install-package rowx-sqlite --no-install-package rowx-embedded

      - name: Build the extension
        run: uv run maturin develop -m packages/rowx-postgres/Cargo.toml

      - name: Apply the example schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/app/schema.sql

      - name: Run the example
        run: uv run python examples/app/main.py

      - name: Check the example
        run: uv run rowx check examples/app

      # the migrations example gets a database of its own, because its tables clash with the app example's
      - name: Create the migrations example database
        working-directory: examples/migrations
        env:
          DATABASE_URL: postgresql://rowx:rowx@localhost:5432/migrations_example
        run: uv run --project ../.. rowx database create

      - name: Run the migrations example
        working-directory: examples/migrations
        env:
          DATABASE_URL: postgresql://rowx:rowx@localhost:5432/migrations_example
        run: uv run --project ../.. python bookshelf.py

      - name: Check the migrations example against the migrated database
        working-directory: examples/migrations
        env:
          DATABASE_URL: postgresql://rowx:rowx@localhost:5432/migrations_example
        run: uv run --project ../.. rowx check

      - name: Check the migrations example with a scratch database
        working-directory: examples/migrations
        run: uv run --project ../.. rowx check --scratch

      - name: Test the migrations example
        working-directory: examples/migrations
        # fail instead of skipping if the plugin finds no database URL
        run: uv run --project ../.. pytest -p no:cacheprovider -o rowx_require_database=true

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Check the changelog
        run: scripts/check-changelog.sh

  required:
    name: Required
    runs-on: ubuntu-latest
    needs:
      - rust
      - python
      - python-postgres
      - embedded-wheel
      - embedded-wheel-macos
      - embedded-rust
      - python-embedded
      - lint
      - distributions
      - examples
      - changelog
    if: always()
    steps:
      - name: Require all CI jobs to succeed
        env:
          ALL_SUCCEEDED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$ALL_SUCCEEDED" = true

  # Keep the existing required contexts until the main ruleset requires CI / Required.
  legacy-required:
    name: ${{ matrix.context }}
    runs-on: ubuntu-latest
    needs: required
    if: always()
    strategy:
      fail-fast: false
      matrix:
        context: ["Linux (3.14)", "Linux (3.15)", "macOS", "Examples"]
    steps:
      - name: Report the CI result
        env:
          RESULT: ${{ needs.required.result }}
        run: test "$RESULT" = success

  tag-release:
    name: Tag release
    needs: required
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch release.yml; a GITHUB_TOKEN tag push does not start it
      contents: write # create the v* tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Decide whether this commit is a release
        id: plan
        run: uv run python scripts/release.py tag-plan

      - name: Fetch main
        if: success() && steps.plan.outputs.action == 'tag'
        run: scripts/tag-release.sh fetch-main

      - name: Install the pinned Rust toolchain
        if: success() && steps.plan.outputs.action == 'tag'
        run: bash scripts/ci-rust-toolchain.sh

      - name: Validate the tag
        if: success() && steps.plan.outputs.action == 'tag'
        env:
          EVENT_NAME: push
          TAG_NAME: ${{ steps.plan.outputs.tag }}
        run: scripts/validate-release.sh

      - name: Create the tag
        if: success() && steps.plan.outputs.action == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.plan.outputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: scripts/tag-release.sh create-tag

      - name: Dispatch Release
        if: success() && steps.plan.outputs.action == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.plan.outputs.tag }}
        run: scripts/tag-release.sh dispatch
