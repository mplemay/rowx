name: Tag release

# Called by CI after a green push to main. A tag push made with GITHUB_TOKEN does not start release.yml, so this
# workflow creates the tag and then dispatches Release on that ref.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  tag:
    name: Tag the release commit
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch release.yml; a GITHUB_TOKEN tag push does not start it
      contents: write # create the v* tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Decide whether this commit is a release
        id: plan
        run: python scripts/release.py tag-plan

      - name: Fetch main
        if: success() && steps.plan.outputs.action == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            git fetch --no-tags --unshallow origin "+refs/heads/main:refs/remotes/origin/main"
          fi

      - name: Install the pinned Rust toolchain
        if: success() && steps.plan.outputs.action == 'tag'
        run: rustup show active-toolchain || rustup toolchain install

      - name: Validate the tag
        if: success() && steps.plan.outputs.action == 'tag'
        env:
          EVENT_NAME: push
          TAG_NAME: ${{ steps.plan.outputs.tag }}
        run: scripts/validate-release.sh

      - name: Create the tag
        if: success() && steps.plan.outputs.action == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.plan.outputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! ${TAG_NAME} =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "refusing unexpected tag name" >&2
            exit 1
          fi
          gh api --method POST "repos/${REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG_NAME}" -f "sha=${HEAD_SHA}"

      - name: Dispatch Release
        if: success() && steps.plan.outputs.action == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! ${TAG_NAME} =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "refusing unexpected tag name" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run release.yml --ref "${TAG_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "could not dispatch Release on ${TAG_NAME}" >&2
          exit 1
