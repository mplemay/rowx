name: Fuzz nullability

# nightly-only and non-blocking: it never runs on pull requests and no branch protection depends on it. The seeded
# soundness run that gates pull requests is part of `just test-py`
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Statements to generate
        default: "5000"

permissions:
  contents: read

concurrency:
  group: fuzz-nullability
  cancel-in-progress: true

env:
  UV_NO_SYNC: "1"

jobs:
  fuzz:
    name: Fuzz nullability
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rowx
          POSTGRES_PASSWORD: rowx
          POSTGRES_DB: rowx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowx -d rowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ROWX_REQUIRE_DB: "1"
      ROWX_TEST_DSN: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the dependencies
        run: uv sync --all-packages --all-groups --no-install-package rowx-postgres --no-install-package rowx-embedded

      - name: Build the extension
        run: uv run maturin develop -m packages/rowx-postgres/Cargo.toml

      # a random seed per run: the report and any failure print it, and ROWX_FUZZ_SEED replays it
      - name: Fuzz and report precision
        env:
          ROWX_FUZZ_REPORT: "1"
          ROWX_FUZZ_SEED: random
          ROWX_FUZZ_COUNT: ${{ inputs.count || '5000' }}
        run: uv run pytest packages/rowx-postgres/src/rowx_postgres/__tests__/integration/describe/test_nullability_fuzz.py -s
