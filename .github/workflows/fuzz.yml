name: Fuzz

# nightly-only and non-blocking: it never runs on pull requests and no branch protection depends on it
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        target:
          - array
          - numeric
          - date
          - time
          - timetz
          - timestamp
          - interval
          - array_elements
          - range
          - network
          - geometric
          - money
          - bits
          - mac
          - hstore
          - ltree
          - cube
          - uuid
          - explain
          - dsn
          - rt_array
          - rt_numeric
          - rt_temporal
          - rt_range
          - rt_network
          - rt_geometric
          - rt_money
          - rt_bits
          - rt_mac
          - rt_hstore
          - rt_ltree
          - rt_cube
          - rt_uuid

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `+nightly` overrides the pinned toolchain, which cargo-fuzz cannot use
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Fuzz
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
          FUZZ_TARGET: ${{ matrix.target }}
        # an input that makes a decoder allocate past the limit fails the run instead of exhausting the runner
        run: cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  protocol-limits:
    name: Protocol limits (2 GiB parameter)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rowx
          POSTGRES_PASSWORD: rowx
          POSTGRES_DB: rowx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowx -d rowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ROWX_REQUIRE_DB: "1"
      ROWX_TEST_DSN: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # the 2^31-byte parameter test is ignored locally because it needs about 2 GiB of memory
      - name: Run the 2 GiB parameter regression
        run: scripts/protocol-limits.sh
