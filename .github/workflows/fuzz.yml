name: Fuzz

# nightly-only and non-blocking: it never runs on pull requests and no branch protection depends on it
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        target: [array, numeric, date, time, timetz, timestamp, interval]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `+nightly` overrides the pinned toolchain, which cargo-fuzz cannot use
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Fuzz
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="$SECONDS_PER_TARGET"

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
