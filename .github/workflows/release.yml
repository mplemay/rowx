name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Validate version and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo '::error::Release tag must be a stable vX.Y.Z version.'
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo '::error::Release tag must point to a commit on main.'
              exit 1
            fi
          fi
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          def read(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))

          version = read("pyproject.toml")["project"]["version"]
          versions = {"Cargo.toml": read("Cargo.toml")["workspace"]["package"]["version"]}
          names = {"rowx-core", "rowx-postgres", "rowx-postgres-py", "rowx-py-core"}
          for package in read("Cargo.lock")["package"]:
              if package["name"] in names:
                  versions[package["name"]] = package["version"]
          if not names <= versions.keys():
              raise SystemExit("Missing workspace packages in Cargo.lock")
          versions["uv.lock"] = next(p["version"] for p in read("uv.lock")["package"] if p["name"] == "rowx")
          if os.environ["EVENT_NAME"] == "push":
              versions["tag"] = os.environ["TAG_NAME"][1:]
          if any(value != version for value in versions.values()):
              raise SystemExit(f"Release version mismatch: expected {version}, got {versions}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY
          cargo metadata --locked --format-version 1 --no-deps > /dev/null

  build-wheels:
    name: Wheel (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            interpreter: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist --interpreter ${{ matrix.interpreter || 'python3.14' }} -m packages/rowx-postgres/Cargo.toml

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Sdist
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist -m packages/rowx-postgres/Cargo.toml

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke-install:
    name: Install smoke test (${{ matrix.name }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/

      - name: Install and check wheel
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} != 1 || ! -f ${wheels[0]} ]]; then
            echo '::error::Expected exactly one wheel.'
            exit 1
          fi
          wheel="$GITHUB_WORKSPACE/${wheels[0]}"
          cd "$RUNNER_TEMP"
          uv run --no-project --python 3.14 --with "$wheel" python -c 'import rowx, rowx.postgres, rowx.postgres._core'
          uv run --no-project --python 3.14 --with "$wheel" rowx --help

  smoke:
    name: Smoke test (${{ matrix.name }}, ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x86_64, linux-aarch64]
        python-version: ["3.14", "3.15"]
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm

    # postgres runs as a plain container so the same job works on the arm runner
    env:
      DATABASE_URL: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/

      - name: Start postgres
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=rowx -e POSTGRES_PASSWORD=rowx -e POSTGRES_DB=rowx \
            --health-cmd "pg_isready -U rowx -d rowx" --health-interval 2s --health-retries 30 \
            postgres:18
          until [ "$(docker inspect -f '{{.State.Health.Status}}' pg)" = healthy ]; do sleep 1; done

      - name: Apply the example schema
        run: docker exec -i pg psql -U rowx -d rowx -v ON_ERROR_STOP=1 < examples/app/schema.sql

      - name: Smoke test the wheel
        run: scripts/smoke-wheel.sh dist/*.whl

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build-wheels, build-sdist, smoke-install, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Validate distributions
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          files = list(Path("dist").iterdir())
          wheels = [p.name for p in files if p.name.startswith(f"rowx-{version}-") and p.suffix == ".whl"]
          expected = (
              ("manylinux", "x86_64"), ("manylinux", "aarch64"),
              ("macosx", "x86_64"), ("macosx", "arm64"), ("win_amd64",),
          )
          if len(files) != 6 or len(wheels) != 5 or not all(
              sum(all(tag in name for tag in target) for name in wheels) == 1 for target in expected
          ):
              raise SystemExit(f"Unexpected distributions: {[p.name for p in files]}")
          if not (Path("dist") / f"rowx-{version}.tar.gz").is_file():
              raise SystemExit("Source distribution is missing or has the wrong version")
          PY

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
