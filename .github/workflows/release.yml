name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Validate version and tag
        id: version
        env:
          # a v* ref publishes, including a workflow_dispatch of that tag; a branch dispatch stays a dry run
          EVENT_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && 'push' || github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: scripts/validate-release.sh

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Check the changelog
        run: scripts/check-changelog.sh

  build-wheels:
    name: Wheel (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            interpreter: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: -m packages/rowx-postgres/Cargo.toml --release --locked --out dist --interpreter ${{ matrix.interpreter || 'python3.14' }}

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  # rowx-sqlite ships the same five platform wheels as rowx-postgres, built from the bundled SQLite C source (MSVC on
  # Windows). The artifacts are named `sqlite-wheel-*` so the `wheel-*` pattern of the rowx-postgres wheels never picks
  # them up.
  build-sqlite-wheels:
    name: SQLite wheel (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            interpreter: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: -m packages/rowx-sqlite/Cargo.toml --release --locked --out dist-sqlite --interpreter ${{ matrix.interpreter || 'python3.14' }}

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-wheel-${{ matrix.name }}
          path: dist-sqlite/*.whl
          if-no-files-found: error

  build-pure:
    name: Pure Python distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Build the CLI and shared core
        run: |
          uv build --package rowx --out-dir dist
          uv build --package rowx-core --out-dir dist
      - name: Upload pure distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pure-distributions
          path: dist/*
          if-no-files-found: error

  build-sdist:
    name: Sdist
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m packages/rowx-postgres/Cargo.toml --out dist

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-sqlite-sdist:
    name: SQLite sdist
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m packages/rowx-sqlite/Cargo.toml --out dist-sqlite

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-sdist
          path: dist-sqlite/*.tar.gz
          if-no-files-found: error

  smoke-install:
    name: Install smoke test (${{ matrix.name }})
    needs: [build-wheels, build-sqlite-wheels, build-pure]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-wheel-${{ matrix.name }}
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/

      - name: Install and check wheel
        shell: bash
        run: scripts/smoke-install-wheel.sh

  smoke:
    name: Smoke test (${{ matrix.name }}, ${{ matrix.python-version }})
    needs: [build-wheels, build-sqlite-wheels, build-pure]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x86_64, linux-aarch64]
        python-version: ["3.14", "3.15"]
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm

    # postgres runs as a plain container so the same job works on the arm runner
    env:
      DATABASE_URL: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-wheel-${{ matrix.name }}
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/

      - name: Start postgres
        run: scripts/start-smoke-postgres.sh

      - name: Apply the example schema
        run: docker exec -i pg psql -U rowx -d rowx -v ON_ERROR_STOP=1 < examples/app/schema.sql

      - name: Smoke test the wheel
        run: scripts/smoke-wheel.sh dist

  # rowx-embedded (the in-process PostgreSQL engine) releases with the rest, from the same tag. It is built with no cache
  # on purpose: a release must not restore build output that a pull request could have written. Only wheels are
  # published (no sdist; CI checks the source archive). The artifacts are named `embedded-wheel-*` so the `wheel-*`
  # pattern of the rowx-postgres wheels never picks them up.
  build-embedded-wheels:
    name: Embedded wheel (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            platform: macosx_
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            platform: _x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
            platform: _aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # the extension is abi3-py314, so one build per platform serves every Python >= 3.14
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: -m packages/rowx-embedded/Cargo.toml --release --locked --out dist-embedded --interpreter python3.14

      - name: Check the wheel (tag, size budget, contents, licenses)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/validate-embedded-wheels.py dist-embedded --platform "$PLATFORM"

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-wheel-${{ matrix.name }}
          path: dist-embedded/*.whl
          if-no-files-found: error

  # a clean venv per platform: the built wheel plus rowx-core and rowx-postgres, with no rowx CLI package
  smoke-embedded:
    name: Embedded smoke test (${{ matrix.name }})
    needs: build-embedded-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: embedded-wheel-${{ matrix.name }}
          path: smoke-wheels/

      # the wheel pins rowx-postgres to this release, which is not on PyPI yet
      - name: Build rowx-core and rowx-postgres
        run: |
          uv build --package rowx-core --wheel --out-dir smoke-wheels
          uvx --from "maturin>=1.0,<2.0" maturin build --locked --manifest-path packages/rowx-postgres/Cargo.toml --interpreter "$(uv python find 3.14)" --out smoke-wheels

      - name: Smoke test the wheel
        run: scripts/smoke-embedded-wheel.sh smoke-wheels

  check-distributions:
    name: Check distributions
    needs:
      [
        validate,
        build-wheels,
        build-sqlite-wheels,
        build-pure,
        build-sdist,
        build-sqlite-sdist,
        build-embedded-wheels,
        smoke-embedded,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sqlite-wheel-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-sdist
          path: dist/

      - name: Validate distributions
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/validate-distributions.py

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: embedded-wheel-*
          path: dist-embedded/
          merge-multiple: true

      - name: Validate the embedded wheels
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/validate-embedded-wheels.py dist-embedded --platform macosx_ --platform _x86_64 --platform _aarch64
          test "$(find dist-embedded -name '*.whl' | wc -l)" -eq 3
          for wheel in dist-embedded/*.whl; do
            case "$(basename "$wheel")" in rowx_embedded-"$VERSION"-*) ;; *) echo "::error::$wheel is not version $VERSION"; exit 1 ;; esac
          done

  rebuild-sdists:
    name: Rebuild sdists offline
    needs: [build-pure, build-sdist, build-sqlite-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install maturin
        run: |
          uv tool install "maturin>=1.0,<2.0"
          uv tool dir --bin >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: ${{ runner.temp }}/release-artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: ${{ runner.temp }}/release-artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-sdist
          path: ${{ runner.temp }}/release-artifacts

      - name: Warm the uv build backend cache
        run: uv build --package rowx --out-dir "$RUNNER_TEMP/uv-build-warm"

      - name: Rebuild pure sdists offline
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage="$RUNNER_TEMP/unpacked-pure"
          mkdir -p "$stage"
          tar -xzf "$RUNNER_TEMP/release-artifacts"/rowx-[0-9]*.tar.gz -C "$stage"
          tar -xzf "$RUNNER_TEMP/release-artifacts"/rowx_core-*.tar.gz -C "$stage"
          projects=( "$stage"/rowx-[0-9]*/ "$stage"/rowx_core-*/ )
          if (( ${#projects[@]} != 2 )); then
            echo "expected rowx and rowx-core sdists" >&2
            exit 1
          fi
          for project in "${projects[@]}"; do
            uv build --offline --out-dir "$RUNNER_TEMP/rebuilt-pure" "$project"
          done

      - name: Fetch rowx-postgres crates
        run: bash scripts/rebuild-sdist-offline.sh fetch postgres

      - name: Rebuild rowx-postgres offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: bash scripts/rebuild-sdist-offline.sh build postgres

      - name: Fetch rowx-sqlite crates
        run: bash scripts/rebuild-sdist-offline.sh fetch sqlite

      - name: Rebuild rowx-sqlite offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: bash scripts/rebuild-sdist-offline.sh build sqlite

  publish-core:
    name: Publish rowx-core
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        validate,
        build-wheels,
        build-sqlite-wheels,
        build-pure,
        build-sdist,
        build-sqlite-sdist,
        smoke-install,
        smoke,
        check-distributions,
        rebuild-sdists,
      ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/pure

      - name: Select rowx-core distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist/rowx-core
          files=( dist/pure/rowx_core-* )
          if (( ${#files[@]} == 0 )); then
            echo "rowx-core has no distributions" >&2
            exit 1
          fi
          cp "${files[@]}" dist/rowx-core/

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Attest rowx-core distributions
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: dist/rowx-core/*

      - name: Publish rowx-core
        run: uv publish --trusted-publishing always "dist/rowx-core/*"

  publish-postgres:
    name: Publish rowx-postgres
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-core.result == 'success'
    needs: publish-core
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist/rowx-postgres
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist/rowx-postgres

      # Inline because publish jobs run no checkout (no repository scripts are available).
      - name: Select rowx-postgres distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( dist/rowx-postgres/* )
          wheels=( dist/rowx-postgres/rowx_postgres-*.whl )
          sdists=( dist/rowx-postgres/rowx_postgres-*.tar.gz )
          if (( ${#wheels[@]} == 0 || ${#sdists[@]} == 0 )); then
            echo "rowx-postgres wheels or sdist are missing" >&2
            exit 1
          fi
          for path in "${files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "unexpected release artifact: $path" >&2
              exit 1
            fi
            name="$(basename "$path")"
            case "$name" in
              rowx_postgres-*) ;;
              *)
                echo "unexpected release artifact: $name" >&2
                exit 1
                ;;
            esac
          done

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Attest rowx-postgres distributions
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: dist/rowx-postgres/*

      - name: Publish rowx-postgres
        run: uv publish --trusted-publishing always "dist/rowx-postgres/*"

  publish-sqlite:
    name: Publish rowx-sqlite
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-core.result == 'success'
    needs: publish-core
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx-sqlite
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sqlite-wheel-*
          path: dist/rowx-sqlite
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlite-sdist
          path: dist/rowx-sqlite

      # Inline because publish jobs run no checkout (no repository scripts are available).
      - name: Select rowx-sqlite distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( dist/rowx-sqlite/* )
          wheels=( dist/rowx-sqlite/rowx_sqlite-*.whl )
          sdists=( dist/rowx-sqlite/rowx_sqlite-*.tar.gz )
          if (( ${#wheels[@]} == 0 || ${#sdists[@]} == 0 )); then
            echo "rowx-sqlite wheels or sdist are missing" >&2
            exit 1
          fi
          for path in "${files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "unexpected release artifact: $path" >&2
              exit 1
            fi
            name="$(basename "$path")"
            case "$name" in
              rowx_sqlite-*) ;;
              *)
                echo "unexpected release artifact: $name" >&2
                exit 1
                ;;
            esac
          done

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Attest rowx-sqlite distributions
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: dist/rowx-sqlite/*

      - name: Publish rowx-sqlite
        run: uv publish --trusted-publishing always "dist/rowx-sqlite/*"

  # the embedded wheels block the release: publish-rowx needs this job, and it needs rowx-postgres on PyPI first
  publish-embedded:
    name: Publish rowx-embedded
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-postgres.result == 'success'
    needs: [validate, check-distributions, publish-postgres]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx-embedded
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: embedded-wheel-*
          path: dist/rowx-embedded
          merge-multiple: true

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Attest rowx-embedded distributions
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: dist/rowx-embedded/*

      - name: Publish rowx-embedded
        run: uv publish --trusted-publishing always "dist/rowx-embedded/*"

  publish-rowx:
    name: Publish rowx
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-postgres.result == 'success' && needs.publish-embedded.result == 'success' &&
      needs.publish-sqlite.result == 'success'
    needs: [publish-postgres, publish-embedded, publish-sqlite]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/pure

      - name: Select rowx distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist/rowx
          copied=0
          for path in dist/pure/*; do
            if [[ ! -f "$path" ]]; then
              continue
            fi
            name="$(basename "$path")"
            case "$name" in
              rowx_core-* | rowx_postgres-* | rowx_sqlite-*) ;;
              rowx-*)
                cp "$path" dist/rowx/
                copied=$((copied + 1))
                ;;
              *)
                echo "unexpected release artifact: $name" >&2
                exit 1
                ;;
            esac
          done
          if (( copied == 0 )); then
            echo "rowx has no distributions" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Attest rowx distributions
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: dist/rowx/*

      - name: Publish rowx
        run: uv publish --trusted-publishing always "dist/rowx/*"

  github-release:
    name: GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-rowx.result == 'success'
    needs: publish-rowx
    runs-on: ubuntu-latest
    permissions:
      contents: write # create or update the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/publish-github-release.sh
