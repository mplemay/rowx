name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Validate version and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: scripts/validate-release.sh

  build-wheels:
    name: Wheel (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            interpreter: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: -m packages/rowx-postgres/Cargo.toml --release --locked --out dist --interpreter ${{ matrix.interpreter || 'python3.14' }}

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  build-pure:
    name: Pure Python distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Build the CLI and shared core
        run: |
          uv build --package rowx --out-dir dist
          uv build --package rowx-core --out-dir dist
      - name: Upload pure distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pure-distributions
          path: dist/*
          if-no-files-found: error

  build-sdist:
    name: Sdist
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m packages/rowx-postgres/Cargo.toml --out dist

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke-install:
    name: Install smoke test (${{ matrix.name }})
    needs: [build-wheels, build-pure]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/

      - name: Install and check wheel
        shell: bash
        run: scripts/smoke-install-wheel.sh

  smoke:
    name: Smoke test (${{ matrix.name }}, ${{ matrix.python-version }})
    needs: [build-wheels, build-pure]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x86_64, linux-aarch64]
        python-version: ["3.14", "3.15"]
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm

    # postgres runs as a plain container so the same job works on the arm runner
    env:
      DATABASE_URL: postgresql://rowx:rowx@localhost:5432/rowx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/

      - name: Start postgres
        run: scripts/start-smoke-postgres.sh

      - name: Apply the example schema
        run: docker exec -i pg psql -U rowx -d rowx -v ON_ERROR_STOP=1 < examples/app/schema.sql

      - name: Smoke test the wheel
        run: scripts/smoke-wheel.sh dist

  check-distributions:
    name: Check distributions
    needs: [validate, build-wheels, build-pure, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Validate distributions
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/validate-distributions.py

  rebuild-sdists:
    name: Rebuild sdists offline
    needs: [build-pure, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install maturin
        run: |
          uv tool install "maturin>=1.0,<2.0"
          uv tool dir --bin >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: ${{ runner.temp }}/release-artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: ${{ runner.temp }}/release-artifacts

      - name: Warm the uv build backend cache
        run: uv build --package rowx --out-dir "$RUNNER_TEMP/uv-build-warm"

      - name: Rebuild pure sdists offline
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage="$RUNNER_TEMP/unpacked-pure"
          mkdir -p "$stage"
          tar -xzf "$RUNNER_TEMP/release-artifacts"/rowx-[0-9]*.tar.gz -C "$stage"
          tar -xzf "$RUNNER_TEMP/release-artifacts"/rowx_core-*.tar.gz -C "$stage"
          projects=( "$stage"/rowx-[0-9]*/ "$stage"/rowx_core-*/ )
          if (( ${#projects[@]} != 2 )); then
            echo "expected rowx and rowx-core sdists" >&2
            exit 1
          fi
          for project in "${projects[@]}"; do
            uv build --offline --out-dir "$RUNNER_TEMP/rebuilt-pure" "$project"
          done

      - name: Fetch rowx-postgres crates
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage="$RUNNER_TEMP/unpacked-postgres"
          mkdir -p "$stage"
          tar -xzf "$RUNNER_TEMP/release-artifacts"/rowx_postgres-*.tar.gz -C "$stage"
          projects=( "$stage"/rowx_postgres-*/ )
          if (( ${#projects[@]} != 1 )); then
            echo "expected one rowx-postgres sdist" >&2
            exit 1
          fi
          # rustup reads rust-toolchain.toml from the build directory; the sdist is outside the checkout
          cp "$GITHUB_WORKSPACE/rust-toolchain.toml" "${projects[0]}/rust-toolchain.toml"
          cargo fetch --locked --manifest-path "${projects[0]}/Cargo.toml"

      - name: Rebuild rowx-postgres offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=( "$RUNNER_TEMP/unpacked-postgres"/rowx_postgres-*/ )
          cd "${projects[0]}"
          PYO3_PYTHON="$(uv python find 3.14)"
          export PYO3_PYTHON
          maturin build --offline --locked --out "$RUNNER_TEMP/rebuilt-postgres"

  publish-core:
    name: Publish rowx-core
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        validate,
        build-wheels,
        build-pure,
        build-sdist,
        smoke-install,
        smoke,
        check-distributions,
        rebuild-sdists,
      ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/pure

      - name: Select rowx-core distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist/rowx-core
          files=( dist/pure/rowx_core-* )
          if (( ${#files[@]} == 0 )); then
            echo "rowx-core has no distributions" >&2
            exit 1
          fi
          cp "${files[@]}" dist/rowx-core/

      - name: Publish rowx-core
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/rowx-core
          skip-existing: true

  publish-postgres:
    name: Publish rowx-postgres
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-core.result == 'success'
    needs: publish-core
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist/rowx-postgres
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist/rowx-postgres

      - name: Select rowx-postgres distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( dist/rowx-postgres/* )
          wheels=( dist/rowx-postgres/rowx_postgres-*.whl )
          sdists=( dist/rowx-postgres/rowx_postgres-*.tar.gz )
          if (( ${#wheels[@]} == 0 || ${#sdists[@]} == 0 )); then
            echo "rowx-postgres wheels or sdist are missing" >&2
            exit 1
          fi
          for path in "${files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "unexpected release artifact: $path" >&2
              exit 1
            fi
            name="$(basename "$path")"
            case "$name" in
              rowx_postgres-*) ;;
              *)
                echo "unexpected release artifact: $name" >&2
                exit 1
                ;;
            esac
          done

      - name: Publish rowx-postgres
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/rowx-postgres
          skip-existing: true

  publish-rowx:
    name: Publish rowx
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-postgres.result == 'success'
    needs: publish-postgres
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist/pure

      - name: Select rowx distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist/rowx
          copied=0
          for path in dist/pure/*; do
            if [[ ! -f "$path" ]]; then
              continue
            fi
            name="$(basename "$path")"
            case "$name" in
              rowx_core-* | rowx_postgres-*) ;;
              rowx-*)
                cp "$path" dist/rowx/
                copied=$((copied + 1))
                ;;
              *)
                echo "unexpected release artifact: $name" >&2
                exit 1
                ;;
            esac
          done
          if (( copied == 0 )); then
            echo "rowx has no distributions" >&2
            exit 1
          fi

      - name: Publish rowx
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/rowx
          skip-existing: true
