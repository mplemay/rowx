name: Release embedded

# `rowx-embedded` is versioned and released on its own (`<pg major>.<pg minor>.<rev>`, tag `embedded-vX.Y.Z`), apart from
# the `v*` release of rowx. Only prebuilt wheels are published; source archives are checked in CI. A manual run is a dry run: it
# builds, checks and smoke tests every wheel (sizes land in each job summary) and never publishes.
on:
  push:
    tags: ["embedded-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-embedded-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Validate version and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: scripts/validate-embedded-release.sh

  # no cache on purpose: a release must not restore build output that a pull request could have written
  build-wheels:
    name: Wheel (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            platform: macosx_
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            platform: _x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
            platform: _aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # the extension is abi3-py314, so one build per platform serves every Python >= 3.14
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: -m packages/rowx-embedded/Cargo.toml --release --locked --out dist --interpreter python3.14

      - name: Check the wheel (tag, size budget, contents, licenses)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/validate-embedded-wheels.py dist --platform "$PLATFORM"

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  # a clean venv per platform: the built wheel plus rowx-core and rowx-postgres, with no rowx CLI package
  smoke:
    name: Smoke test (${{ matrix.name }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: smoke-wheels/

      # the companion needs the driver at the same commit; rowx-postgres is not necessarily on PyPI yet
      - name: Build rowx-core and rowx-postgres
        run: |
          uv build --package rowx-core --wheel --out-dir smoke-wheels
          uvx --from "maturin>=1.0,<2.0" maturin build --locked --manifest-path packages/rowx-postgres/Cargo.toml --interpreter "$(uv python find 3.14)" --out smoke-wheels

      - name: Smoke test the wheel
        run: scripts/smoke-embedded-wheel.sh smoke-wheels

  distributions:
    name: Check distributions
    needs: [validate, build-wheels, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Check the release set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/validate-embedded-wheels.py dist --platform macosx_ --platform _x86_64 --platform _aarch64
          test "$(find dist -name '*.whl' | wc -l)" -eq 3
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in rowx_embedded-"$VERSION"-*) ;; *) echo "::error::$wheel is not version $VERSION"; exit 1 ;; esac
          done

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/embedded-v')
    needs: [validate, distributions]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rowx-embedded
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
