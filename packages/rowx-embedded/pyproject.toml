[project]
name = "rowx-embedded"
version = "18.4.0"
description = "In-process PostgreSQL 18 engine host for rowx (development, checking and tests)"
readme = "README.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Typing :: Typed",
    "Topic :: Database",
]
keywords = ["postgresql", "postgres", "embedded", "wasm", "rowx"]
dependencies = []

[project.urls]
Repository = "https://github.com/mplemay/rowx"
Issues = "https://github.com/mplemay/rowx/issues"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "rowx_embedded._engine"
python-packages = ["rowx_embedded"]
python-source = "src"
# source archives need the local patch; Cargo downloads the remaining dependencies from the registry
include = [{ path = "vendor/wasmer-compiler/**/*", format = "sdist" }]
exclude = [
    { path = "**/__pycache__/**", format = "wheel" },
    { path = "**/*.pyc", format = "wheel" },
]
