[package]
name = "rowx-embedded-host"
version = "18.4.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[dependencies]
liboliphaunt-wasix-portable = "=0.3.2"
oliphaunt-wasix.workspace = true
rustix = { version = "1", features = ["process", "fs", "net", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
zstd = { version = "0.13", default-features = false }

[lints]
workspace = true
