# the license gate for the in-process engine dependency tree: `cargo deny --manifest-path packages/rowx-embedded/Cargo.toml check licenses`
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "PostgreSQL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

# saffron 0.1.0 ships a BSD-3-Clause LICENSE file but declares it through
# license-file instead of a machine-readable SPDX expression.
[[licenses.clarify]]
crate = "saffron@0.1.0"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0xb4dc584e }]
