[project]
name = "rowx-core"
version = "0.4.0"
description = "Shared typed query primitives for rowx database implementations"
readme = "README.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Database",
    "Framework :: AsyncIO",
]
keywords = ["sql", "postgresql", "postgres", "typed", "async", "t-string"]
dependencies = []

[project.urls]
Documentation = "https://mplemay.github.io/rowx/"
Repository = "https://github.com/mplemay/rowx"
Issues = "https://github.com/mplemay/rowx/issues"
Changelog = "https://github.com/mplemay/rowx/blob/main/docs/changelog.md"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["**/__tests__/**", "**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib", "**/*.rs", "**/Cargo.toml"]
source-exclude = ["**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib"]
