[project]
name = "rowx-core"
version = "0.2.0"
description = "Shared typed query primitives for rowx database implementations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["**/__tests__/**", "**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib", "**/*.rs", "**/Cargo.toml"]
source-exclude = ["**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib"]
