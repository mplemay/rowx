#:schema https://www.schemastore.org/git-cliff.json

[changelog]
header = """
# Changelog

Each release lists features, fixes, performance work, and breaking changes.
"""
body = """
{% if version %}\
    {% set version_name = version | trim_start_matches(pat="v") %}\
    {% if previous.version %}\
        ## [{{ version_name }}](https://github.com/mplemay/rowx/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version_name }}](https://github.com/mplemay/rowx/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    {% if entry.commits %}\
        ### {{ entry.group }}
        {% for commit in entry.commits %}\
            - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
            {%- if commit.remote -%}
                {%- if commit.remote.pr_author %} by @{{ commit.remote.pr_author }}\
                {%- elif commit.remote.username %} by @{{ commit.remote.username }}\
                {%- endif -%}
            {%- endif %}
        {% endfor %}\
    {% endif %}
{% endfor %}\
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
output = "docs/changelog.md"
# git-cliff's formatter escapes `#` in pull links after postprocessors run, so rumdl formats the file
format = false

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = true
fail_on_unmatched_commit = false
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/mplemay/rowx/pull/${1}))" },
]
commit_parsers = [
  { field = "breaking", pattern = "^true$", group = "Breaking changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = ".*", skip = true },
]
processing_order = [
  "commit_preprocessors",
  "split_commits",
  "conventional_commits",
  "commit_parsers",
  "link_parsers",
]
tag_pattern = "v[0-9].*"
ignore_tags = 'v0\.4\.[01]'
topo_order = false
topo_order_commits = true
sort_commits = "newest"
