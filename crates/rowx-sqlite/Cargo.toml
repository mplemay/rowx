[package]
name = "rowx-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rowx-core.workspace = true
# exact pins: the bundled SQLite version is part of the contract; libsqlite3-sys 0.37.0 bundles SQLite 3.51.3
rusqlite = { version = "=0.39.0", features = ["bundled", "column_decltype", "column_metadata", "limits", "backup"] }
libsqlite3-sys = "=0.37.0"
thiserror = "2"
tokio = { workspace = true }

[features]
# test-only hooks (raw handle access, a row counter, a raw interrupt); the integration tests enable it
test-support = []

[dev-dependencies]
rowx-sqlite = { path = ".", features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "test-util", "rt-multi-thread"] }

[lints]
workspace = true
