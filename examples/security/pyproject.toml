[project]
name = "rowx-example-security"
version = "0.0.0"
description = "A filtered, sortable listing that builds dynamic SQL without string concatenation"
requires-python = ">=3.14"
dependencies = ["rowx[postgres]"]

[tool.rowx]
include = ["."]
database_url_env = "DATABASE_URL"
statement_timeout = "10s"
