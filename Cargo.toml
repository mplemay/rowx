[workspace]
resolver = "3"
members = [
    "crates/rowx-core",
    "crates/rowx-postgres",
    "crates/rowx-py-core",
    "packages/rowx-postgres",
]
# cargo-fuzz targets need nightly and unsafe code, so they stay out of the workspace and its lints.
# packages/rowx-embedded is its own workspace: the engine pulls in about 440 Wasmer crates (edition 2024, rust-version
# 1.93), a vendored patch and its own lock file, and none of that may build under `cargo test --workspace` or clippy.
exclude = ["fuzz", "packages/rowx-embedded"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# pyo3 and pyo3-async-runtimes minors always move together (docs/contributing/architecture.md)
pyo3 = { version = "0.28", features = ["abi3-py314"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rowx-core = { path = "crates/rowx-core" }
rowx-postgres = { path = "crates/rowx-postgres" }
rowx-py-core = { path = "crates/rowx-py-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
