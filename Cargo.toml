[workspace]
resolver = "3"
members = [
    "crates/rowx-core",
    "crates/rowx-postgres",
    "packages/rowx-postgres",
]
# cargo-fuzz targets need nightly and unsafe code, so they stay out of the workspace and its lints
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
# pyo3 and pyo3-async-runtimes minors always move together (docs/design/architecture.md)
pyo3 = { version = "0.28", features = ["abi3-py314"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rowx-core = { path = "crates/rowx-core" }
rowx-postgres = { path = "crates/rowx-postgres" }
rowx-py-core = { path = "." }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

# the root package is rowx-py-core. `include` is what `cargo package` (and maturin sdist
# vendoring) copies; without it the package root is the repo and the rowx-postgres sdist
# vendors every workspace file.
[package]
name = "rowx-py-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
include = [
    "Cargo.toml",
    "src/lib.rs",
    "src/errors.rs",
    "src/runtime.rs",
]

[lib]
test = false
doctest = false

[dependencies]
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
rowx-core.workspace = true
tokio.workspace = true

[lints]
workspace = true
