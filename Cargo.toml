[workspace]
resolver = "3"
members = [
    "crates/rowx-core",
    "crates/rowx-postgres",
    "crates/rowx-py-core",
    "crates/rowx-postgres-py",
    "crates/rowx-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# pyo3 and pyo3-async-runtimes minors always move together (docs/design/architecture.md)
pyo3 = { version = "0.28", features = ["abi3-py314"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rowx-core = { path = "crates/rowx-core" }
rowx-postgres = { path = "crates/rowx-postgres" }
rowx-py-core = { path = "crates/rowx-py-core" }
rowx-postgres-py = { path = "crates/rowx-postgres-py" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
