[project]
name = "rowx"
version = "0.3.0"
description = "Typesafe SQL queries for python without an ORM"
readme = "README.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Database",
    "Framework :: AsyncIO",
]
keywords = ["sql", "postgresql", "postgres", "typed", "async", "t-string"]
dependencies = ["rowx-core==0.3.0", "pathspec>=1.1.1,<2"]

[project.optional-dependencies]
postgres = ["rowx-postgres==0.3.0"]
# rowx-embedded releases in lockstep with rowx; it ships wheels for macOS arm64 and Linux x86_64/aarch64 only, so the
# marker leaves it out elsewhere and `rowx[embedded]` still installs (using it then raises InterfaceError)
embedded = [
    "rowx-postgres==0.3.0",
    "rowx-embedded==0.3.0; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]
# only for the opt-in `rowx.testing` pytest plugin; `import rowx` never imports pytest
pytest = ["pytest>=9.2.0"]

[project.urls]
Documentation = "https://mplemay.github.io/rowx/"
Repository = "https://github.com/mplemay/rowx"
Issues = "https://github.com/mplemay/rowx/issues"
Changelog = "https://github.com/mplemay/rowx/blob/main/docs/changelog.md"

[project.scripts]
rowx = "rowx.check.cli:main"

[tool.uv]

[tool.uv.workspace]
members = ["packages/rowx-core", "packages/rowx-postgres", "packages/rowx-embedded"]

[tool.uv.sources]
rowx-core = { workspace = true }
rowx-postgres = { workspace = true }
rowx-embedded = { workspace = true }

[tool.uv.build-backend]
wheel-exclude = ["**/__tests__/**", "**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib", "**/*.rs", "**/Cargo.toml"]
source-exclude = ["**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "rowx-postgres==0.3.0",
    "rowx-embedded==0.3.0",
    "anyio>=4.16.0",
    "maturin>=1.0,<2.0",
    "mypy==2.4.1",
    "prek>=0.5.9",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.11",
    "pyright==1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "rumdl>=0.3.2",
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.2.0",
    "ty>=0.0.95",
    "zizmor==1.32.0",
]
bench = [
    "asyncpg>=0.31.0",
]
bench-drivers = [
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.0.41",
]
docs = [
    "zensical==0.1.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120
include = ["pyproject.toml"]
preview = true
required-version = ">=0.17.2"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "D",          # pydocstyle (project uses inline comments instead of docstrings)
    "CPY",        # flake8-copyright (project does not use copyright headers)
    "formatting", # overlaps ruff format; preview whitespace rules live in this category
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "print", # print is intentional in CLI entry points
]
"**/__tests__/**/*" = [
    "missing-type-function-argument",  # missing type annotation for function argument
    "missing-return-type-undocumented-public-function",  # missing return type annotation for public function
    "missing-return-type-private-function",  # missing return type annotation for private function
    "implicit-namespace-package",  # implicit namespace package (tests dir may not need __init__.py)
    "magic-value-comparison", # magic value used in comparison (fine in test cases)
    "assert",    # use of assert (tests typically use assert directly)
    "private-member-access",  # private member accessed
    "import-private-name",  # tests import private modules
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
preview = true
docstring-code-format = true
quote-style = "double"

[tool.ruff.analyze]
preview = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
return-type-inference = "always"
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
all = "error"

[[tool.ty.overrides]]
include = ["**/__tests__/**"]

[tool.ty.overrides.rules]
# Tests live inside the package, so ty will not treat the dev dependency group as declared.
missing-direct-dependency = "ignore"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
# pytest-asyncio warns while this is unset, and filterwarnings = "error" fails the session
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/rowx/__tests__", "packages/rowx-core/src/rowx_core/__tests__", "packages/rowx-postgres/src/rowx_postgres/__tests__", "packages/rowx-embedded/src/rowx_embedded/__tests__"]
norecursedirs = ["target", "dist", "build", ".venv"]
markers = [
    "db: marks tests that need a live Postgres (ROWX_TEST_DSN)",
    "timing: marks tests that synchronise on pg_stat_activity (implies server)",
    "server: marks tests that need a real server (several sessions, cancel, TLS, CREATE DATABASE, pg_stat_activity, timing, password auth or a TCP port; needs=...) or that hit an embedded engine divergence (divergence=...); they skip when ROWX_TEST_DSN is embedded://",
    "embedded: marks tests that run the embedded engine (the embedded lane selects them)",
]
filterwarnings = ["error"]

[tool.rumdl]
line_length = 120

[tool.rumdl.MD013]
reflow = true
code_blocks = false
tables = false
