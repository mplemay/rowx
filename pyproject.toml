[project]
name = "rowx"
version = "0.1.0"
description = "Typesafe SQL queries for python without an ORM"
readme = "README.md"
authors = [
    { name = "Matt LeMay", email = "mplemay@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
# only for the opt-in `rowx.testing` pytest plugin; `import rowx` never imports pytest
pytest = ["pytest>=9.1.1"]

[project.scripts]
rowx = "rowx.check.cli:main"

[tool.maturin]
manifest-path = "crates/rowx-py/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "rowx._core"
python-packages = ["rowx"]
python-source = "src"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "mypy==2.4.0",
    "prek>=0.5.7",
    "psycopg[binary]>=3.3.6",
    "pyright==1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "rumdl>=0.3.0",
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.2.0",
    "ty>=0.0.91",
]
bench = [
    "asyncpg>=0.31.0",
]
bench-drivers = [
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.0.41",
]

[tool.ruff]
target-version = "py314"
line-length = 120
include = ["pyproject.toml"]
preview = true
required-version = ">=0.17.2"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "D",          # pydocstyle (project uses inline comments instead of docstrings)
    "CPY",        # flake8-copyright (project does not use copyright headers)
    "formatting", # overlaps ruff format; preview whitespace rules live in this category
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "print", # print is intentional in CLI entry points
]
"**/__tests__/**/*" = [
    "missing-type-function-argument",  # missing type annotation for function argument
    "missing-return-type-undocumented-public-function",  # missing return type annotation for public function
    "missing-return-type-private-function",  # missing return type annotation for private function
    "implicit-namespace-package",  # implicit namespace package (tests dir may not need __init__.py)
    "magic-value-comparison", # magic value used in comparison (fine in test cases)
    "assert",    # use of assert (tests typically use assert directly)
    "private-member-access",  # private member accessed
    "import-private-name",  # tests import private modules
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
preview = true
docstring-code-format = true
quote-style = "double"

[tool.ruff.analyze]
preview = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
return-type-inference = "always"
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
all = "error"

[[tool.ty.overrides]]
include = ["**/__tests__/**"]

[tool.ty.overrides.rules]
# Tests live inside the package, so ty will not treat the dev dependency group as declared.
missing-direct-dependency = "ignore"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["src/rowx/__tests__"]
pythonpath = ["."]
norecursedirs = ["target", "dist", "build", ".venv"]
markers = [
    "integration: marks tests that hit the database or external services",
    "db: marks tests that need a live Postgres (ROWX_TEST_DSN)",
    "timing: marks tests that synchronise on pg_stat_activity",
]
filterwarnings = ["error"]

[tool.rumdl]
line_length = 120

[tool.rumdl.MD013]
reflow = true
code_blocks = false
tables = false
